[project]
name = "nge2-gltf"
version = "0.1.0"
description = "Research converter for NGE2 HGOB/HGMS assets"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2,<3",
    "pillow>=11,<13",
    "pygltflib>=1.16.5,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

