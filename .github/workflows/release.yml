name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching package.json, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Validate release version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" || "$package_version" != "$tauri_version" ]]; then
            echo "Tag ($RELEASE_TAG), package ($package_version), and Tauri ($tauri_version) versions must match." >&2
            exit 1
          fi
      - run: yarn install --frozen-lockfile
      - run: cargo test --workspace
      - run: yarn typecheck
      - run: yarn build

  publish:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.target, 'aarch64-apple') && 'aarch64-apple-darwin' || startsWith(matrix.target, 'x86_64-apple') && 'x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: yarn install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: NGE2 ISO Studio ${{ env.RELEASE_TAG }}
          releaseBody: Download the installer for your operating system from the assets below.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          retryAttempts: 2
          tauriScript: yarn tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
